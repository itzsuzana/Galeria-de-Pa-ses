<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Galeria de Países</title>

    <link rel="icon" href="img/brasil.png">

    <link rel="stylesheet" href="trocarImagem.css">
</head>

<body>

    <main class="cartao">

        <h1>🌎 Galeria de Países</h1>

        <p class="descricao">
            Escolha um país para conhecer um pouco mais.
        </p>

        <img
            id="img-pais"
            src="img/brasil.png"
            alt="Bandeira do Brasil"
        >

        <h2 id="nome-pais">
            🇧🇷 Brasil
        </h2>

        <p id="informacao">
            O Brasil é o maior país da América do Sul.
        </p>

        <div class="botoes">

            <button
                type="button"
                onclick="mostrarBrasil()"
            >
                🇧🇷 Brasil
            </button>

            <button
                type="button"
                onclick="mostrarEspanha()"
            >
                🇪🇸 Espanha
            </button>

        </div>

    </main>

    <script src="trocarImagem.js"></script>

</body>

</html>
